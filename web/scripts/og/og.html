<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Outfit;font-weight:600;src:url(../../node_modules/@fontsource/outfit/files/outfit-latin-600-normal.woff2)}
@font-face{font-family:Outfit;font-weight:700;src:url(../../node_modules/@fontsource/outfit/files/outfit-latin-700-normal.woff2)}
@font-face{font-family:"DM Sans";font-weight:500;src:url(../../node_modules/@fontsource/dm-sans/files/dm-sans-latin-500-normal.woff2)}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#EFE7DA;overflow:hidden;position:relative;font-family:"DM Sans";color:#191919}
/* the workbench, full bleed: screenshots/og-scene.png is the stage at 1087 x 720 (2x); a 1087 x 571 band of it fills the card */
.scene{position:absolute;left:0;top:-70px;width:1200px;height:auto}
.card{position:absolute;left:28px;top:28px;bottom:28px;width:468px;border-radius:40px;background:#DED7CD;box-shadow:0 18px 50px rgba(60,45,25,.18);
  padding:0 44px;display:flex;flex-direction:column;justify-content:center}
.tag{align-self:flex-start;background:#EFE9DF;color:#191919;font-size:20px;font-weight:500;padding:8px 18px;border-radius:999px;margin-bottom:22px}
h1{font-family:Outfit;font-weight:700;font-size:92px;line-height:.95;letter-spacing:-.045em}
p{font-size:27px;line-height:1.28;color:#4A4742;margin-top:22px;font-weight:500}
.pills{display:flex;flex-wrap:wrap;gap:9px;margin-top:28px}
.pill{font-family:Outfit;font-weight:600;font-size:20px;padding:8px 18px;border-radius:999px;background:#FFAC00;color:#191919;white-space:nowrap}
.pill.b{background:#028AC2;color:#fff}.pill.w{background:#EFE9DF}.pill.r{background:#D7362B;color:#fff}
</style></head><body>
<img class="scene" src="../../screenshots/og-scene.png">
<div class="card">
<div class="tag">kodedot.murilogp.dev</div>
<h1>KodeDot<br>Sim</h1>
<p>The Kode Dot in your browser: run real apps, wire parts, write code.</p>
<div class="pills"><span class="pill">kodeOS</span><span class="pill b">Real apps</span><span class="pill w">3D workbench</span><span class="pill r">Arduino + ESP32</span></div>
</div></body></html>
